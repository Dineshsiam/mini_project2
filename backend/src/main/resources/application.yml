server:
  port: 8080

spring:
  application:
    name: scheme-recommendation-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/farmers_schemes
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: HikariCP-Farmers

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  open-in-view: false

app:
  data-path: ../dataset/schemes_with_embeddings.json

logging:
  level:
    root: INFO
    com.farmers.recommendation: DEBUG
    org.hibernate.SQL: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"